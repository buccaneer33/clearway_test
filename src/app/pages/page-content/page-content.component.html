<div [attr.id]="`${idPrefix()}${id()}`" class="page-content">
  <pinch-zoom
    [wheel]="false"
    [minScale]="1"
    [disablePan]="false"
    [limit-zoom]="10"
    [draggableImage]="true"
    [limitPan]="false">
    <img src="{{content()}}" alt="{{`${idPrefix()}${id()}`}}">
  </pinch-zoom>
</div>
